<svg viewBox="0 0 500 470" role="img" aria-label="The actuarial control cycle: define the problem, design the solution, monitor the results, looping continuously within professional standards and the wider environment.">
  <defs>
    <marker id="accArrowW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- colour wheel -->
  <path d="M68.1,125 A210,210 0 0 1 431.9,125 L336.6,180 A100,100 0 0 0 163.4,180 Z" fill="#2FA8DC" opacity="0.9"/>
  <path d="M431.9,125 A210,210 0 0 1 250,440 L250,330 A100,100 0 0 0 336.6,280 Z" fill="#0A5B84" opacity="0.92"/>
  <path d="M250,440 A210,210 0 0 1 68.1,125 L163.4,180 A100,100 0 0 0 250,330 Z" fill="#8E1B21" opacity="0.9"/>

  <!-- flow arrows -->
  <path d="M300,142 A150,150 0 0 1 358,222" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" marker-end="url(#accArrowW)"/>
  <path d="M310,335 A150,150 0 0 1 190,335" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" marker-end="url(#accArrowW)"/>
  <path d="M142,222 A150,150 0 0 1 200,142" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" marker-end="url(#accArrowW)"/>

  <!-- node 1: define -->
  <circle cx="250" cy="75" r="76" fill="#fff" stroke="#2FA8DC" stroke-width="2.5"/>
  <g transform="translate(250,55)" stroke="#1180B8" stroke-width="3.4" stroke-linecap="round" fill="none">
    <circle cx="-4" cy="-4" r="10"/>
    <line x1="4" y1="4" x2="12" y2="12"/>
  </g>
  <text x="250" y="97" text-anchor="middle" font-size="15" font-weight="600" fill="#0A5B84" font-family="Instrument Sans, sans-serif">
    <tspan x="250" dy="0">Define the</tspan>
    <tspan x="250" dy="18">problem</tspan>
  </text>
  <text x="250" y="137" text-anchor="middle" font-size="11" fill="#1180B8" font-family="Instrument Sans, sans-serif">Understand the need</text>
  <circle cx="196" cy="24" r="15" fill="#2FA8DC"/>
  <text x="196" y="24" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#fff" font-family="Instrument Sans, sans-serif">1</text>

  <!-- node 2: design -->
  <circle cx="384" cy="307.5" r="76" fill="#fff" stroke="#0A5B84" stroke-width="2.5"/>
  <g transform="translate(384,287.5)" stroke="#0A5B84" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="10"/>
    <circle cx="0" cy="0" r="3.5" fill="#0A5B84" stroke="none"/>
    <line x1="0" y1="-13" x2="0" y2="-18"/>
    <line x1="0" y1="13" x2="0" y2="18"/>
    <line x1="-13" y1="0" x2="-18" y2="0"/>
    <line x1="13" y1="0" x2="18" y2="0"/>
    <line x1="-9.2" y1="-9.2" x2="-12.7" y2="-12.7"/>
    <line x1="9.2" y1="9.2" x2="12.7" y2="12.7"/>
    <line x1="-9.2" y1="9.2" x2="-12.7" y2="12.7"/>
    <line x1="9.2" y1="-9.2" x2="12.7" y2="-12.7"/>
  </g>
  <text x="384" y="329.5" text-anchor="middle" font-size="15" font-weight="600" fill="#083049" font-family="Instrument Sans, sans-serif">
    <tspan x="384" dy="0">Design the</tspan>
    <tspan x="384" dy="18">solution</tspan>
  </text>
  <text x="384" y="369.5" text-anchor="middle" font-size="11" fill="#0A5B84" font-family="Instrument Sans, sans-serif">Build &amp; apply a model</text>
  <circle cx="330" cy="256.5" r="15" fill="#0A5B84"/>
  <text x="330" y="256.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#fff" font-family="Instrument Sans, sans-serif">2</text>

  <!-- node 3: monitor -->
  <circle cx="116" cy="307.5" r="76" fill="#fff" stroke="#8E1B21" stroke-width="2.5"/>
  <g transform="translate(102,289.5)" stroke="#8E1B21" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="0" y1="20" x2="0" y2="8"/>
    <line x1="9" y1="20" x2="9" y2="1"/>
    <line x1="18" y1="20" x2="18" y2="-6"/>
  </g>
  <path d="M129,285 L134,290 L145,276" stroke="#8E1B21" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="116" y="329.5" text-anchor="middle" font-size="15" font-weight="600" fill="#6E1318" font-family="Instrument Sans, sans-serif">
    <tspan x="116" dy="0">Monitor the</tspan>
    <tspan x="116" dy="18">results</tspan>
  </text>
  <text x="116" y="369.5" text-anchor="middle" font-size="11" fill="#8E1B21" font-family="Instrument Sans, sans-serif">Compare &amp; learn</text>
  <circle cx="170" cy="256.5" r="15" fill="#8E1B21"/>
  <text x="170" y="256.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#fff" font-family="Instrument Sans, sans-serif">3</text>

  <text x="250" y="458" text-anchor="middle" font-size="12" fill="#8496A6" font-family="Instrument Sans, sans-serif">↻ the cycle repeats continuously</text>
</svg>
